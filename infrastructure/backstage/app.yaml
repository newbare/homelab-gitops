apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.10.1
    helm:
      releaseName: backstage
      values: |
        backstage:
          image:
            registry: docker.io
            repository: newbare/homelab-backstage
            tag: v20
            pullPolicy: Always

          # Segredos que viram variáveis de ambiente no Pod:
          #   backstage-keycloak     -> KEYCLOAK_CLIENT_SECRET (fluxo OIDC)
          #   backstage-auth-session -> AUTH_SESSION_SECRET   (auth.session.secret)
          extraEnvVarsSecrets:
            - backstage-github-token
            - backstage-keycloak
            - backstage-auth-session

          # O backend precisa alcançar https://keycloak.local: o discovery do OIDC
          # devolve URLs públicas e o provider aceita SÓ `metadataUrl`.
          # O Pod não usa o /etc/hosts do Mac — o mapeamento tem que existir aqui.
          hostAliases:
            - ip: 10.152.183.36 # ClusterIP do svc ingress-nginx-controller
              hostnames:
                - keycloak.local

          # homelab-ca    -> a CA interna, DISTRIBUÍDA pelo trust-manager.
          #                 O ConfigMap `homelab-ca` é criado automaticamente em
          #                 todos os namespaces pelo Bundle em
          #                 infrastructure/cert-manager/ca.yaml — não é copiado à
          #                 mão nem versionado no Git.
          #
          # catalog-users -> um `Group` por role + um `User` por pessoa, para o
          #                 resolver de sign-in achar a entidade.
          #
          #                 ⚠️ Este ConfigMap NÃO está no Git — de propósito.
          #                 Repositório público + nome/e-mail de pessoas = dado
          #                 pessoal, e dado pessoal não se versiona. Ele é GERADO
          #                 a partir do MESMO `users.csv` que provisiona o
          #                 Keycloak (arquivo ignorado pelo Git) e aplicado
          #                 direto no cluster, sem passar pelo disco:
          #
          #                   python3 \
          #                     infrastructure/backstage/scripts/generate-catalog.py \
          #                     | kubectl apply -f -
          #
          #                 Justificativa completa e o trade-off (é o único passo
          #                 que não é puramente GitOps) em
          #                 infrastructure/backstage/scripts/README.md.
          extraVolumes:
            - name: homelab-ca
              configMap:
                name: homelab-ca
            - name: catalog-users
              configMap:
                name: backstage-catalog-users
          extraVolumeMounts:
            - name: homelab-ca
              mountPath: /etc/homelab-ca
              readOnly: true
            - name: catalog-users
              mountPath: /etc/backstage-catalog
              readOnly: true

          extraEnvVars:
            - name: POSTGRES_HOST
              value: postgresql.postgresql.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-postgresql
                  key: password
            # Faz o processo Node confiar na CA interna. O arquivo vem do
            # ConfigMap `homelab-ca`, criado pelo trust-manager — ver
            # docs/certificados/01-trust-anchor-interno.md.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/homelab-ca/ca.crt
          appConfig:
            app:
              title: "Resilience Cloud Portal"
              baseUrl: https://backstage.local
              packages: all
              extensions:
                - page:home:
                    config:
                      path: /
                      defaultConfig:
                        - component: HomePageSearchBar
                          column: 0
                          row: 0
                          width: 12
                          height: 2
                          deletable: false
                        - component: GettingStarted
                          column: 0
                          row: 1
                          width: 4
                          height: 11
                        - component: HomePageStarredEntities
                          column: 4
                          row: 2
                          width: 4
                          height: 4
                        - component: HomePageRandomJoke
                          column: 8
                          row: 2
                          width: 4
                          height: 4
                        - component: HomePageToolkit
                          column: 4
                          row: 6
                          width: 4
                          height: 3
                        - component: HomePageWorldClock
                          column: 8
                          row: 6
                          width: 4
                          height: 3
                        - component: HomePageMostVisited
                          column: 4
                          row: 9
                          width: 4
                          height: 4
                        - component: HomePageRecentlyVisited
                          column: 8
                          row: 9
                          width: 4
                          height: 4
                - home-page-widget:home/toolkit:
                    config:
                      tools:
                        - url: https://backstage.io/docs
                          label: Docs
                          icon: docs
                        - url: https://github.com/backstage/backstage
                          label: GitHub
                          icon: github
                        - url: https://github.com/backstage/backstage/blob/master/CONTRIBUTING.md
                          label: Contributing
                          icon: docs
                        - url: https://backstage.io/plugins
                          label: Plugins Directory
                          icon: kind:component
                        - url: https://github.com/backstage/backstage/issues/new/choose
                          label: Submit New Issue
                          icon: github
                - home-page-widget:home/world-clock:
                    config:
                      clockConfigs:
                        - label: NYC
                          timeZone: America/New_York
                        - label: UTC
                          timeZone: UTC
                        - label: STO
                          timeZone: Europe/Stockholm
                        - label: TYO
                          timeZone: Asia/Tokyo
                - api:home/visits: true
                - app-root-element:home/visit-listener: true
            backend:
              baseUrl: https://backstage.local
              listen:
                port: 7007
              cors:
                origin: https://backstage.local
              csp:
                connect-src:
                  - "'self'"
                  - "https:"
              database:
                client: pg
                connection:
                  host: ${POSTGRES_HOST}
                  port: ${POSTGRES_PORT}
                  user: ${POSTGRES_USER}
                  password: ${POSTGRES_PASSWORD}
                  database: backstage
            auth:
              environment: production
              # Necessário para o fluxo OIDC. Ativa o express-session, que grava na
              # tabela `sessions` — tabela criada pelas MIGRATIONS do plugin auth
              # no database `backstage_plugin_auth` (confirmado no cluster; é por
              # isso que o Backstage usa `createtable: false` no session store).
              session:
                secret: ${AUTH_SESSION_SECRET}
              providers:
                guest:
                  dangerouslyAllowOutsideDevelopment: true
                # ⚠️ O provider OIDC itera as CHAVES DIRETAS deste bloco e trata
                # cada uma como NOME DE AMBIENTE (OAuthEnvironmentHandler.mapConfig).
                # Por isso `production:` é obrigatório — não é estilo, é o formato
                # que o código lê. O frontend envia `?env=production`, valor que vem
                # de `auth.environment` acima. Os três precisam casar.
                oidc:
                  production:
                    metadataUrl: https://keycloak.local/realms/resilience/.well-known/openid-configuration
                    clientId: backstage
                    clientSecret: ${KEYCLOAK_CLIENT_SECRET}
                    callbackUrl: https://backstage.local/api/auth/oidc/handler/frame
                    # ⚠️ O padrão do Backstage é `none`:
                    #     const prompt = initializedPrompt || "none";
                    # Com `none`, o Keycloak NÃO mostra o formulário quando o usuário
                    # não tem sessão — devolve `error=login_required` ao callback, e o
                    # primeiro login de todo usuário falha.
                    #
                    # `auto` é um valor ESPECIAL: o código faz `if (prompt !== "auto")`,
                    # ou seja, `auto` OMITE o parâmetro e deixa o IdP decidir. Verificado
                    # seguindo o redirect sem sessão (ver docs da fase 11).
                    prompt: auto
                    signIn:
                      resolvers:
                        # Resolve pelo LOCAL PART do e-mail (fulano@dominio ->
                        # user:default/fulano) — é literalmente o que o código
                        # faz: `profile.email.split("@")[0]`. Escolhido no lugar
                        # de `emailMatchingUserEntityProfileEmail`, cujo fallback
                        # geraria um entityRef contendo `@` — inválido como nome
                        # de entidade. Os nomes reais estão no `users.csv`, fora
                        # do Git; ver infrastructure/backstage/scripts/README.md
                        - resolver: emailLocalPartMatchingUserEntityName
            # Sem este bloco o catálogo fica VAZIO no cluster: as
            # `catalog.locations` do app-config.production.yaml da imagem NUNCA são
            # lidas, porque o chart sobrescreve o CMD e passa apenas o ConfigMap
            # gerado do `appConfig` daqui.
            #
            # O arquivo apontado vem do volume `catalog-users`, que é o ConfigMap
            # PROVISIONADO (ver comentário em extraVolumes) — não é versionado.
            catalog:
              rules:
                - allow: [Component, System, API, Resource, Location, User, Group, Template]
              locations:
                - type: file
                  target: /etc/backstage-catalog/users.yaml
            integrations:
              github:
                - host: github.com
                  token: ${GITHUB_TOKEN}
        ingress:
          enabled: false
        postgresql:
          enabled: false
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
