apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7" # Depois de toda a observabilidade
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.10.0 # Substitua pela versão que você encontrou
    helm:
      releaseName: backstage
      values: |
        # Configuração mínima para o laboratório
        backstage:
          appConfig:
            app:
              title: "Homelab Developer Portal"
            backend:
              baseUrl: http://backstage.local
              listen:
                port: 7007
              cors:
                origin: http://backstage.local
        ingress:
          enabled: false # Vamos criar o Ingress separadamente
        postgresql:
          enabled: true # O chart cria um PostgreSQL para o Backstage
          auth:
            password: "backstage-lab-password" # Apenas para o lab
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
