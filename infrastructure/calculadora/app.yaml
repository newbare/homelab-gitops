apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calculadora
  namespace: argocd
  annotations:
    # Wave 9: último da fila. A calculadora não depende de ninguém do cluster,
    # mas depende do NAMESPACE, que é criado pela Application `namespaces`
    # (wave -1). Sobra ela por último porque é a mais nova, não porque precisa.
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Aponta para o PRÓPRIO repositório: o chart mora junto do código do app
    # (`apps/calculadora`), porque o app é feito de arquivos de texto que viram
    # ConfigMap — não de uma imagem. Assim `git push` é o deploy, sem build.
    repoURL: https://github.com/newbare/homelab-gitops.git
    targetRevision: main
    # O ArgoCD detecta Helm sozinho por causa do Chart.yaml neste diretório.
    path: apps/calculadora
  destination:
    server: https://kubernetes.default.svc
    namespace: calculadora
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ⚠️ ServerSideApply é OBRIGATÓRIO aqui, não preferência de estilo.
      #
      # Os ConfigMaps deste app são grandes de propósito: o da web leva o painel,
      # a página de documentação e o logo em base64 (323 KB), e o de dados leva o
      # snapshot de preços com o catálogo de 1.249 modelos de EC2 (318 KB).
      #
      # Com apply no modo CLIENTE, o ArgoCD grava o objeto inteiro no annotation
      # `last-applied-configuration` — e o limite de annotation é 256 KiB, MENOR
      # que o limite de 1 MB do ConfigMap. O apply falha assim:
      #
      #   ConfigMap "calculadora-web" is invalid: metadata.annotations:
      #   Too long: may not be more than 262144 bytes
      #
      # O sintoma engana: o Pod fica em ContainerCreating com "configmap not
      # found", como se o ConfigMap nunca tivesse sido criado. Ele até aparece
      # no render — o que falha é a GRAVAÇÃO.
      #
      # Server-side apply não usa esse annotation. Efeitos colaterais a conhecer:
      # conflito de campo com quem já seja dono dos campos, e `--force` não pode
      # ser usado junto (ver docs/praticas/README.md, seção 9.3).
      - ServerSideApply=true
      # O namespace é declarado em infrastructure/namespaces/, como os outros.
      - CreateNamespace=false
