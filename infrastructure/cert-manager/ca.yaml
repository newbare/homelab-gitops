# CA interna do homelab — Opção B do trust anchor.
#
# Documento com a análise completa e as 3 opções comparadas:
#   docs/certificados/01-trust-anchor-interno.md
#
# ---------------------------------------------------------------------------
# POR QUE ISTO EXISTE
# ---------------------------------------------------------------------------
# O ClusterIssuer `selfsigned-issuer` (spec.selfSigned: {}) gera, para CADA
# Certificate, um certificado autoassinado INDEPENDENTE. Esse certificado é, ao
# mesmo tempo, folha E raiz.
#
# Consequência: toda renovação (~90 dias) troca a âncora de confiança. Qualquer
# cópia do certificado feita para outro namespace (obrigatória, porque o K8s não
# monta Secret de outro namespace) fica obsoleta — e quebra silenciosamente.
#
# Esta CA separa as duas camadas:
#
#   raiz   -> homelab-ca         (10 anos, ESTÁVEL)   <- é isto que se copia
#   folha  -> o que ela assinar  (90 dias, rotativo)  <- não precisa ser copiado
#
# É exatamente o desenho do Let's Encrypt: raiz estável + folha rotativa.
# Ver a seção 3 de docs/certificados/01-trust-anchor-interno.md.
#
# ---------------------------------------------------------------------------
# ESCOPO / BLAST RADIUS
# ---------------------------------------------------------------------------
# Criar a CA NÃO muda nenhum certificado existente. Só passam a usá-la os hosts
# cuja annotation `cert-manager.io/cluster-issuer` for trocada para
# `homelab-ca-issuer`. Começamos apenas por `keycloak.local`.
#
# ⚠️ O `Certificate` abaixo é um recurso de RAIZ DE CONFIANÇA.
#    Não usar `prune: true` na Application que o gerencia — ver ca-app.yaml.
# ---------------------------------------------------------------------------
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
spec:
  # `isCA: true` é o que diferencia uma CA de uma folha. Gera o certificado com
  # Basic Constraints CA:TRUE e permite que ele assine outros certificados.
  isCA: true
  commonName: homelab-ca
  secretName: homelab-ca
  # 10 anos. É a longevidade que torna a cópia para outros namespaces segura:
  # não expira na prática durante a vida do laboratório.
  duration: 87600h
  renewBefore: 8760h # renova 1 ano antes do vencimento (ano 9)
  privateKey:
    algorithm: ECDSA
    size: 256
    # `rotationPolicy: Never` mantém a MESMA chave privada nas renovações. Para
    # uma CA isso é importante: trocar a chave mudaria a identidade da raiz.
    rotationPolicy: Never
  issuerRef:
    # Usa o próprio selfSigned que já existia, apenas para emitir a CA.
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# ClusterIssuer que assina as FOLHAS usando a CA acima.
#
# O `secretName` é resolvido no "cluster resource namespace" do cert-manager
# (por default, `cert-manager`) — por isso o Certificate da CA é criado lá.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-issuer
spec:
  ca:
    secretName: homelab-ca
