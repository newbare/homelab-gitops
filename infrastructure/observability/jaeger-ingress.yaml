apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: istio-system
spec:
  ingressClassName: public
  rules:
  - host: jaeger.local
    http:
      paths:
      - path: /jaeger
        pathType: Prefix
        backend:
          service:
            name: tracing
            port:
              number: 80
