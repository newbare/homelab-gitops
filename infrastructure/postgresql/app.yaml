apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: resilience-cloud
    app.kubernetes.io/component: database
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/newbare/homelab-gitops.git
    targetRevision: main
    path: infrastructure/postgresql
    directory:
      include: "{configmap.yaml,service.yaml,statefulset.yaml}"
      exclude: "{app.yaml,secret.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: postgresql
  # Ignora diferenças em campos imutáveis/gerenciados pelo k8s
  # Resolve o OutOfSync falso positivo do volumeClaimTemplates (StatefulSet)
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.status
        - .spec.volumeClaimTemplates[]?.metadata.creationTimestamp
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
