apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: postgresql
data:
  create-databases.sql: |
    -- ============================================
    -- Databases + Users para a stack Resilience Cloud
    -- ============================================

    -- Backstage
    CREATE DATABASE backstage;
    CREATE USER backstage WITH PASSWORD 'backstage-password';
    GRANT ALL PRIVILEGES ON DATABASE backstage TO backstage;
    ALTER DATABASE backstage OWNER TO backstage;

    -- Keycloak
    CREATE DATABASE keycloak;
    CREATE USER keycloak WITH PASSWORD 'keycloak-password';
    GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
    ALTER DATABASE keycloak OWNER TO keycloak;

    -- Grafana (futuro)
    CREATE DATABASE grafana;
    CREATE USER grafana WITH PASSWORD 'grafana-password';
    GRANT ALL PRIVILEGES ON DATABASE grafana TO grafana;
    ALTER DATABASE grafana OWNER TO grafana;

    -- Calculadora Resilience (fase F2)
    --
    -- Atencao: este arquivo roda APENAS na primeira inicializacao do volume
    -- (docker-entrypoint-initdb.d). Num cluster que ja existe, quem garante os
    -- bancos e o Job `postgresql-garantir-bancos` (init-job.yaml), que roda
    -- este MESMO arquivo tolerando o "ja existe" e depois VERIFICA o resultado.
    -- A lista de bancos existe num lugar so, aqui.
    CREATE DATABASE calculadora;
    CREATE USER calculadora WITH PASSWORD 'calculadora-password';
    GRANT ALL PRIVILEGES ON DATABASE calculadora TO calculadora;
    ALTER DATABASE calculadora OWNER TO calculadora;